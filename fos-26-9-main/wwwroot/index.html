<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#24103e">
    <title>FelisOS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/shelf.css">
</head>
<body>
    <main id="desktop-workspace" aria-label="FelisOS desktop"></main>

    <aside id="cabinet" class="panel hidden" aria-label="Application Cabinet"></aside>
    <aside id="device-dock" class="panel hidden" aria-label="Device Dock"></aside>
    <nav id="shelf"></nav>

    <script src="js/vfs.js"></script>
    <script src="js/window-manager.js"></script>
    <script src="js/kernel.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('FelisOS Kernel (Service Worker) registered.', reg))
                    .catch(err => console.error('Kernel panic: Service Worker failed.', err));
            });
        }
    </script>
</body>
</html>
